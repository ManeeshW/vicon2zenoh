[Base]
Object = Car@192.168.11.2
Port = 3883
zenoh_key = fdcl/base
latency: 0.0
frequency: 5.0
on: true
std_x: 0.5
std_R: 0.08727
noise_x_enabled: false
noise_R_enabled: false
position_only: false

# Fast pose topic: no noise, no latency, clean pose at independent rate
fast_key: fdcl/base_pose_sync_fast
fast_enable: true
fast_frequency: 200
# zenoh_key and fast_key are both output in NED frame (R_ni = R_nv * R_vm * R_im)
fast_legacy_frame: false

[Rover]
Object = OriginsX@192.168.11.2
Port = 3883
zenoh_key = fdcl/rover
latency: 0.0
frequency: 5.0
on: true
std_x: 0.5
std_R: 0.08727
noise_x_enabled: false
noise_R_enabled: false
position_only: false

# Fast pose topic: no noise, no latency, clean pose at independent rate
fast_key: fdcl/pose_sync_fast
fast_enable: true
fast_frequency: 200
# zenoh_key (fdcl/rover) is output in NED frame, but fast_key (fdcl/pose_sync_fast) stays
# in the legacy (pre-NED) frame unchanged — it is used to fly the drone.
fast_legacy_frame: true

[Relative]
# rover2base (left):  position/attitude of rover expressed in base frame — default
# base2rover (right): position/attitude of base expressed in rover frame
Measurement_type = rover2base
zenoh_key = fdcl/pose_sync
latency: 0.0
frequency: 5.0
on: true
std_x: 0.01
std_R: 0.08727
noise_x_enabled: true
noise_R_enabled: true
position_only: false

# Fast pose topic: no noise, no latency, clean pose at independent rate
fast_key: fdcl/rel_pose_sync_fast
fast_enable: true
fast_frequency: 200

# Ground-truth state topic (pos, vel, R, omega) — Savitzky–Golay smoothed velocities
# Published JSON fields: timestamp (s), rel_pos, rel_vel, rel_R, rel_omega
# gt_freq: independent publish rate, decoupled from [Relative] frequency above
gt_state_key: fdcl/rel_gt_state
gt_state_enable: true
gt_freq: 200

# Output coordinate frame transform (applied as: pos' = T*pos, R' = T*R*T^T, vel' = T*vel, omega' = T*omega)
# gt_transform_matrix: row-major 3x3, 9 comma-separated values
# Left as identity: Base/Rover clean poses now already carry the marker->IMU (R_im)
# conjugation, so the relative pose is already in IMU/body frame here — applying a
# second, non-identity transform would double the conjugation and cancel it back out.
gt_transform_enable: true
gt_transform_matrix: 1,0,0, 0,1,0, 0,0,1

# Savitzky–Golay differentiator for the GT state: a sliding window of clean samples
# is fitted with a least-squares polynomial (in actual time) and evaluated at the
# window CENTER — smoothed value = poly(center), velocity = analytic derivative.
# Ultrasmooth and essentially noiseless, at a fixed latency of half the window;
# the published timestamp is the center sample's real time so consumers can align.
#   gt_sg_window — odd number of samples; span = window/gt_freq (21 @ 200Hz = 105ms
#                  span, ~52ms latency); larger = smoother, more latency
#   gt_sg_order  — polynomial order of the fit (3 handles acceleration)
gt_sg_window: 21
gt_sg_order: 3

# Glitch guard: drop samples stepping farther than this from the last accepted
# sample (Vicon occlusion jumps would otherwise smear across the whole window).
# <= 0 disables the guard.
gt_sg_max_jump_m: 0.5
