# Multi-object Vicon -> Zenoh bridge configuration (C++)
#
# objects        : comma-separated list of Vicon object names (ObjectName@IP)
# object_keys    : comma-separated Zenoh keys, one per object
# pose_sync_from : index (0-based) of the "from" object for relative pose
# pose_sync_to   : index (0-based) of the "to" object for relative pose
# pose_sync_key  : Zenoh key for the relative pose output
#
# fdcl/pose_sync publishes the pose of object[pose_sync_to]
# expressed in the frame of object[pose_sync_from]:
#   x_rel = R_from.T * (x_to - x_from)
#   R_rel = R_from.T * R_to
#
# Per-object overrides (object_N_<setting>) apply only to object at index N.
# Supported per-object settings: frequency, latency, std_x, std_R,
#                                 noise_x_enabled, noise_R_enabled
# Example:
#   object_0_frequency: 100
#   object_0_latency: 0.05
#   object_1_frequency: 50
#   object_1_noise_x_enabled: true

objects: OriginsX@192.168.11.2, Car@192.168.11.2
object_keys: fdcl/rover, fdcl/base
pose_sync_from: 0
pose_sync_to: 1
pose_sync_key: fdcl/pose_sync_fast

on: true

# Global defaults (applied to all objects unless overridden below)
frequency: 200
latency: 0.0

std_x: 0.01
std_R: 0.001
noise_x_enabled: false
noise_R_enabled: false

# Ground-truth relative state topic (rel_pos, rel_vel, rel_R, rel_omega)
# rel_pose_transform_enable: applies T=[[0,1,0],[1,0,0],[0,0,1]] to all output vectors/matrices
#
# Kalman filter parameters for velocity estimation:
#   kf_q_pos   — CA process noise spectral density (m/s^3); smaller = smoother velocity
#   kf_r_pos   — position measurement noise variance (m^2); Vicon ~0.5mm → ~1e-6
#   kf_q_omega — CV omega process noise spectral density (rad/s^2)
#   kf_r_omega — omega measurement noise variance (rad/s)^2
rel_gt_state_key: fdcl/rel_gt_state
rel_gt_state_enable: true
gui_enable: true
rel_pose_transform_enable: true
# 3x3 output-frame transform, row-major (9 comma-separated values).
# Applied as: pos' = T*pos, vel' = T*vel, R' = T*R*T^T, omega' = det(T)*T*omega
rel_pose_transform: 1,0,0, 0,1,0, 0,0,1
kf_q_pos: 1.0
kf_r_pos: 0.000001
kf_q_omega: 5.0
kf_r_omega: 0.04

# Per-object overrides (uncomment and edit as needed)
object_0_frequency: 200
object_0_latency: 0.0
object_0_noise_x_enabled: false
object_0_noise_R_enabled: false
object_1_frequency: 200
object_1_latency: 0.0
object_1_noise_x_enabled: false
object_1_noise_R_enabled: false
