[Base]
Object = Car@192.168.11.2
Port = 3883
zenoh_key = fdcl/base
latency: 0.0
frequency: 5.0
on: true
std_x: 0.5
std_R: 0.08727
noise_x_enabled: false
noise_R_enabled: false
position_only: false

# Fast pose topic: no noise, no latency, clean pose at independent rate
fast_key: fdcl/base_pose_sync_fast
fast_enable: true
fast_frequency: 200
# zenoh_key and fast_key are both output in NED frame (R_ni = R_nv * R_vm * R_im)
fast_legacy_frame: false

[Rover]
Object = OriginsX@192.168.11.2
Port = 3883
zenoh_key = fdcl/rover
latency: 0.0
frequency: 5.0
on: true
std_x: 0.5
std_R: 0.08727
noise_x_enabled: false
noise_R_enabled: false
position_only: false

# Fast pose topic: no noise, no latency, clean pose at independent rate
fast_key: fdcl/pose_sync_fast
fast_enable: true
fast_frequency: 200
# zenoh_key (fdcl/rover) is output in NED frame, but fast_key (fdcl/pose_sync_fast) stays
# in the legacy (pre-NED) frame unchanged — it is used to fly the drone.
fast_legacy_frame: true

[Relative]
# rover2base (left):  position/attitude of rover expressed in base frame — default
# base2rover (right): position/attitude of base expressed in rover frame
Measurement_type = rover2base
zenoh_key = fdcl/pose_sync
latency: 0.0
frequency: 5.0
on: true
std_x: 0.01
std_R: 0.08727
noise_x_enabled: true
noise_R_enabled: true
position_only: false

# Fast pose topic: no noise, no latency, clean pose at independent rate
fast_key: fdcl/rel_pose_sync_fast
fast_enable: true
fast_frequency: 200

# Ground-truth state topic (pos, vel, R, omega) — zero-latency, Kalman-filtered velocities
# Published JSON fields: timestamp (s), rel_pos, rel_vel, rel_R, rel_omega
# gt_freq: independent publish rate, decoupled from [Relative] frequency above
gt_state_key: fdcl/rel_gt_state
gt_state_enable: true
gt_freq: 200

# Output coordinate frame transform (applied as: pos' = T*pos, R' = T*R*T^T, vel' = T*vel, omega' = T*omega)
# gt_transform_matrix: row-major 3x3, 9 comma-separated values
# Left as identity: Base/Rover clean poses now already carry the marker->IMU (R_im)
# conjugation, so the relative pose is already in IMU/body frame here — applying a
# second, non-identity transform would double the conjugation and cancel it back out.
gt_transform_enable: true
gt_transform_matrix: 1,0,0, 0,1,0, 0,0,1

# Kalman filter parameters for velocity/omega estimation
#   kf_q_pos   — CA process noise spectral density (m/s^3); smaller = smoother velocity
#   kf_r_pos   — position measurement noise variance (m^2); Vicon ~0.5mm -> ~1e-6
#   kf_q_omega — CV omega process noise spectral density (rad/s^2)
#   kf_r_omega — omega measurement noise variance (rad/s)^2
kf_q_pos: 0.01
kf_r_pos: 0.000001
kf_q_omega: 0.5
kf_r_omega: 0.04

# Spike rejection: clip each measurement's innovation to this many std-devs before
# it can move the filter state, so a single glitched/occluded marker reading can't
# inject a step change into position/velocity or omega. 0 disables gating.
kf_gate_sigma_pos: 5.0
kf_gate_sigma_omega: 5.0

# EMA post-filter applied after Kalman (second smoothing stage), specified as a time
# constant in seconds rather than a fixed per-sample alpha — this keeps smoothing
# strength consistent regardless of gt_freq (effective alpha = 1 - exp(-dt/tau)).
# Larger tau = smoother but more lag.
vel_smooth_tau_sec: 0.5
omega_smooth_tau_sec: 0.3
